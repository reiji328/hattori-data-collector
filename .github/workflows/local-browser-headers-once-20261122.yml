name: CUBE NOTE - local browser header comparison (loopback only)

on:
  push:
    branches:
      - experiment/20261122-local-header-audit
    paths:
      - .github/workflows/local-browser-headers-once-20261122.yml

permissions:
  contents: read

concurrency:
  group: cube-note-local-header-20261122
  cancel-in-progress: false

jobs:
  header-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium for local-only verification
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.65.1
          npx playwright install chromium --with-deps
      - name: Observe only loopback request headers
        run: node diagnostics/local_browser_headers_audit.cjs
