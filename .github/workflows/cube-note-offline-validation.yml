name: CUBE NOTE - Offline validation only

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cube-note-offline-validation
  cancel-in-progress: false

jobs:
  offline-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch pinned test code from private My-Knowledge
        shell: bash
        env:
          MY_KNOWLEDGE_TOKEN: ${{ secrets.MY_KNOWLEDGE_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          token = os.getenv('MY_KNOWLEDGE_TOKEN', '')
          if not token:
              raise SystemExit('STOP: missing MY_KNOWLEDGE_TOKEN secret')

          commit = '72d68773bf4bce0bb76c381376387e5bb9152b11'
          base_path = 'Projects/CUBE_NOTE/Development_20261118/offline_pipeline_v01'
          expected = {
              'pipeline_offline.cjs': '442eedb6be04e2700f398644fdd6d038206a1263bc0f58bf52ba5e81bef15541',
              'test_pipeline_offline.cjs': '607646b0e8205763b8fdb76e4a24e731b90c01eb82cdd6f872d5ae246af0bcda',
          }
          folder = Path('offline-pipeline-check')
          folder.mkdir(parents=True, exist_ok=True)
          for filename, expected_sha in expected.items():
              path = f'{base_path}/{filename}'
              url = (
                  'https://api.github.com/repos/reiji328/My-Knowledge/contents/'
                  + quote(path, safe='/') + '?ref=' + commit
              )
              req = Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'User-Agent': 'hattori-offline-validation',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urlopen(req, timeout=20) as response:
                      payload = json.load(response)
              except (HTTPError, URLError):
                  raise SystemExit('STOP: private source read failed') from None
              if payload.get('type') != 'file' or payload.get('encoding') != 'base64':
                  raise SystemExit('STOP: unexpected private file encoding')
              raw = base64.b64decode(payload['content'], validate=False)
              if hashlib.sha256(raw).hexdigest() != expected_sha:
                  raise SystemExit('STOP: pinned source SHA-256 mismatch')
              (folder / filename).write_bytes(raw)
          print('PASS: pinned private code fetched and SHA-256 verified')
          print('No P\'s CUBE request, source data, credentials, or artifacts published')
          PY

      - name: Run 26 synthetic tests without P's CUBE access
        shell: bash
        run: |
          node --version
          node --test offline-pipeline-check/test_pipeline_offline.cjs
